<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Voice Appointment Agent - Live Call Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 30, 49, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-primary: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --status-disconnected: #64748b;
      --status-listening: #10b981;
      --status-thinking: #f59e0b;
      --status-speaking: #8b5cf6;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 10%, #1e293b 0%, #090d16 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #f1f5f9 40%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 14px;
    }

    .main-container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Status & Visualizer Area */
    .status-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 12px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 500;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--status-disconnected);
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }

    .status-dot.listening {
      background: var(--status-listening);
      box-shadow: 0 0 12px var(--status-listening);
    }

    .status-dot.thinking {
      background: var(--status-thinking);
      box-shadow: 0 0 12px var(--status-thinking);
    }

    .status-dot.speaking {
      background: var(--status-speaking);
      box-shadow: 0 0 12px var(--status-speaking);
    }

    .stats {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      gap: 14px;
    }

    /* Waveform Canvas */
    .visualizer-box {
      width: 100%;
      height: 70px;
      background: rgba(10, 15, 29, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Transcript Box */
    .transcript-container {
      height: 280px;
      overflow-y: auto;
      padding: 16px;
      background: rgba(10, 15, 29, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 13.5px;
      line-height: 1.5;
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.caller {
      align-self: flex-end;
      background: #2563eb;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .message.agent {
      align-self: flex-start;
      background: #334155;
      color: #f8fafc;
      border-bottom-left-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .message-author {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.75;
      margin-bottom: 2px;
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    button {
      flex: 1;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button#start-btn {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
    }

    button#start-btn:hover:not(:disabled) {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    button#end-btn {
      background: #dc2626;
      color: #ffffff;
    }

    button#end-btn:hover:not(:disabled) {
      background: #b91c1c;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .token-row {
      display: flex;
      gap: 8px;
      font-size: 12px;
    }

    .token-row input {
      flex: 1;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-main);
      padding: 6px 12px;
      font-size: 12px;
    }

    .token-row input:focus {
      outline: 1px solid var(--accent-primary);
    }
  </style>
</head>
<body>

  <header>
    <h1>AI Voice Appointment Agent</h1>
    <p class="subtitle">Direct Browser Audio Transport (16 kHz PCM16 &bull; Full Duplex &bull; Barge-in)</p>
  </header>

  <div class="main-container">

    <!-- Status Bar -->
    <div class="status-panel">
      <div class="status-indicator">
        <div id="status-dot" class="status-dot"></div>
        <span id="status-text">Disconnected</span>
      </div>
      <div class="stats">
        <span>Mic: <strong id="mic-status">Off</strong></span>
        <span>Packets: <strong id="packet-count">0</strong></span>
      </div>
    </div>

    <!-- Live Audio Waveform -->
    <div class="visualizer-box">
      <canvas id="visualizer"></canvas>
    </div>

    <!-- Live Transcript -->
    <div class="transcript-container" id="transcript">
      <div class="message agent">
        <div class="message-author">Assistant</div>
        <div>Press "Start Call" to open a live audio session using your microphone.</div>
      </div>
    </div>

    <!-- Security Token (Optional) -->
    <div class="token-row">
      <input type="password" id="auth-token" placeholder="Optional shared call token (?token=...)">
    </div>

    <!-- Call Action Buttons -->
    <div class="controls">
      <button id="start-btn" onclick="startCall()">
        <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.25 1.02l-2.2 2.2z"/></svg>
        Start Call
      </button>
      <button id="end-btn" onclick="endCall()" disabled>
        <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.58.9a13.9 13.9 0 00-3.1 2.05.99.99 0 01-1.39 0L.3 13.74a.99.99 0 010-1.4A19.98 19.98 0 0112 7c4.68 0 8.97 1.63 12.02 4.34a.99.99 0 010 1.4l-2.03 2.03a.99.99 0 01-1.39 0 13.9 13.9 0 00-3.1-2.05.99.99 0 01-.58-.9V9.72A14.28 14.28 0 0012 9z"/></svg>
        End Call
      </button>
    </div>

  </div>

  <script>
    let ws = null;
    let audioCtx = null;
    let micStream = null;
    let workletNode = null;
    let analyser = null;
    let animId = null;
    let packetsSent = 0;

    // Web Audio Queue & Barge-in Tracking
    let nextPlaybackTime = 0;
    const activeSources = [];

    // AudioWorklet processor loaded from static/js/pcm_worklet.js (module worklet)
    // which imports the shared resampler from static/js/resampler.js.
    // No inline copy of the algorithm exists here — single source of truth.

    function updateState(state) {
      const dot = document.getElementById('status-dot');
      const text = document.getElementById('status-text');
      dot.className = 'status-dot';

      if (state === 'listening') {
        dot.classList.add('listening');
        text.innerText = 'Listening (Say something)';
      } else if (state === 'thinking') {
        dot.classList.add('thinking');
        text.innerText = 'Thinking...';
      } else if (state === 'speaking') {
        dot.classList.add('speaking');
        text.innerText = 'Speaking (Agent answering)';
      } else if (state === 'connected') {
        dot.classList.add('listening');
        text.innerText = 'Connected';
      } else {
        text.innerText = 'Disconnected';
      }
    }

    function addTranscript(role, text) {
      const container = document.getElementById('transcript');
      const msg = document.createElement('div');
      msg.className = 'message ' + (role === 'caller' ? 'caller' : 'agent');
      msg.innerHTML = '<div class="message-author">' + (role === 'caller' ? 'You' : 'Assistant') + '</div><div>' + text + '</div>';
      container.appendChild(msg);
      container.scrollTop = container.scrollHeight;
    }

    function clearPlaybackQueue() {
      // Immediate Barge-in execution: Stop and discard all queued audio sources
      while (activeSources.length > 0) {
        const src = activeSources.pop();
        try {
          src.stop();
          src.disconnect();
        } catch (e) {}
      }
      if (audioCtx) {
        nextPlaybackTime = audioCtx.currentTime;
      }
    }

    async function startCall() {
      document.getElementById('start-btn').disabled = true;
      document.getElementById('end-btn').disabled = false;
      packetsSent = 0;
      document.getElementById('packet-count').innerText = '0';

      const token = document.getElementById('auth-token').value.trim();
      const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      let wsUrl = wsProtocol + '//' + window.location.host + '/ws/call?mode=echo';
      if (token) wsUrl += '&token=' + encodeURIComponent(token);

      ws = new WebSocket(wsUrl);
      ws.binaryType = 'arraybuffer';

      ws.onopen = async () => {
        updateState('connected');
        await initMicrophone();
      };

      ws.onmessage = (event) => {
        if (typeof event.data === 'string') {
          // JSON control packet
          try {
            const data = JSON.parse(event.data);
            if (data.type === 'clear') {
              clearPlaybackQueue();
            } else if (data.type === 'transcript') {
              addTranscript(data.role, data.text);
            } else if (data.type === 'state') {
              updateState(data.state);
            }
          } catch (e) {}
        } else if (event.data instanceof ArrayBuffer) {
          // Inbound binary PCM16 16kHz audio from server / echo test
          playAudioChunk(event.data);
        }
      };

      ws.onclose = () => {
        endCall();
      };

      ws.onerror = () => {
        endCall();
      };
    }

    async function initMicrophone() {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        try {
          audioCtx = new AudioContextClass({ sampleRate: 16000 });
        } catch (e) {
          // Fallback for Safari / mobile drivers that reject non-hardware sample rates
          audioCtx = new AudioContextClass();
        }
        nextPlaybackTime = audioCtx.currentTime;

        // Microphone capture with hardware echo cancellation and noise suppression
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
            channelCount: 1
          }
        });

        document.getElementById('mic-status').innerText = 'Active';

        // Set up Waveform Visualizer
        const source = audioCtx.createMediaStreamSource(micStream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;
        source.connect(analyser);
        drawVisualizer();

        // Load AudioWorklet from standalone module (single source of truth)
        await audioCtx.audioWorklet.addModule('/static/js/pcm_worklet.js');

        workletNode = new AudioWorkletNode(audioCtx, 'pcm-processor');
        source.connect(workletNode);

        workletNode.port.onmessage = (e) => {
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(e.data); // Transmit binary PCM16 16kHz frame
            packetsSent++;
            if (packetsSent % 20 === 0) {
              document.getElementById('packet-count').innerText = packetsSent;
            }
          }
        };

      } catch (err) {
        alert('Microphone error: ' + err.message);
        endCall();
      }
    }

    function playAudioChunk(arrayBuffer) {
      if (!audioCtx) return;
      const int16Array = new Int16Array(arrayBuffer);
      const float32Array = new Float32Array(int16Array.length);

      for (let i = 0; i < int16Array.length; i++) {
        float32Array[i] = int16Array[i] / 32768.0;
      }

      const audioBuffer = audioCtx.createBuffer(1, float32Array.length, 16000);
      audioBuffer.getChannelData(0).set(float32Array);

      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(audioCtx.destination);

      const startTime = Math.max(audioCtx.currentTime, nextPlaybackTime);
      source.start(startTime);
      nextPlaybackTime = startTime + audioBuffer.duration;

      activeSources.push(source);
      source.onended = () => {
        const idx = activeSources.indexOf(source);
        if (idx !== -1) activeSources.splice(idx, 1);
      };
    }

    function drawVisualizer() {
      const canvas = document.getElementById('visualizer');
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      function render() {
        animId = requestAnimationFrame(render);
        analyser.getByteFrequencyData(dataArray);

        ctx.fillStyle = 'rgba(10, 15, 29, 0.4)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const barWidth = (canvas.width / bufferLength) * 2;
        let x = 0;

        for (let i = 0; i < bufferLength; i++) {
          const barHeight = (dataArray[i] / 255) * canvas.height * 0.85;
          ctx.fillStyle = '#38bdf8';
          ctx.fillRect(x, canvas.height - barHeight, barWidth - 1, barHeight);
          x += barWidth;
        }
      }
      render();
    }

    function endCall() {
      if (ws) {
        try { ws.close(); } catch (e) {}
        ws = null;
      }
      if (micStream) {
        micStream.getTracks().forEach(t => t.stop());
        micStream = null;
      }
      if (workletNode) {
        try { workletNode.disconnect(); } catch (e) {}
        workletNode = null;
      }
      if (audioCtx) {
        try { audioCtx.close(); } catch (e) {}
        audioCtx = null;
      }
      if (animId) {
        cancelAnimationFrame(animId);
        animId = null;
      }
      clearPlaybackQueue();

      document.getElementById('start-btn').disabled = false;
      document.getElementById('end-btn').disabled = true;
      document.getElementById('mic-status').innerText = 'Off';
      updateState('disconnected');
    }
  </script>
</body>
</html>
